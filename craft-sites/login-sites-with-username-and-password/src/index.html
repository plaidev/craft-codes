<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="none"> <!--Google検索などの対象にしたい場合は消す-->
    <title>管理画面にログイン</title>
    <link rel="stylesheet" href="./lib/bulma/bulma.min.css">
    <link rel="stylesheet" href="./style.css" />
</head>

<body class="has-background-light">
    <section class="section">
        <h1 class="title">管理画面にログイン</h1>
        <div class="container mt-6">
            <div class="columns is-centered">
                <div class="column is-5-tablet is-4-desktop is-3-widescreen">
                    <form id="loginForm" class="box">
                        <div class="field">
                            <label for="username" class="label">Username</label>
                            <div class="control">
                                <input type="text" id="username" name="username" class="input" required>
                            </div>
                        </div>
                        <div class="field">
                            <label for="" class="label">Password</label>
                            <div class="control">
                                <input type="password" id="password" name="password" placeholder="*******" class="input"
                                    autocomplete="current-password" required>
                            </div>
                        </div>
                        <div class="field">
                            <p id="error-message" class="help is-danger"></p>
                        </div>

                        <div class="field">
                            <button id="submit" type="submit" class="button is-success">
                                Login
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="./index.js" type="module"></script>
</body>

</html>
